[project]
name = "fresh-choice-research-api"
version = "1.0.0"
description = "FastAPI backend for the Fresh Choice research prototype"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.116,<1"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "uvicorn>=0.35,<1",
  "workers-py",
  "workers-runtime-sdk",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
